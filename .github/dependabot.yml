version: 2
updates:
  # The workflows pin each action to a commit hash; this keeps those hashes current,
  # in one pull request a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile pins its base image by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
# The tools CI installs (.github/requirements) are pinned by hash; refresh them with the
# command at the top of each file. test.txt covers Python 3.9 and later (pytest 8.4.2 on
# 3.9, the newest that installs there); build.txt is for the 3.13 build jobs.
# Dependabot would offer versions that no longer install on 3.9.
