name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r .github/requirements/test.txt
      - name: test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check codexwatch tests

  package:
    name: build and install the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # build and setuptools come pinned by hash, so the build is not left to fetch its own.
      # setuptools 84 needs Python 3.10, so the wheel is built on 3.13 and then run on 3.9,
      # the oldest Python the package supports.
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build --no-isolation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: install the wheel and run it on invented logs
        run: |
          set -euo pipefail
          pip install dist/*.whl
          codexwatch --version | grep -qx "codexwatch $(python -c 'import codexwatch;print(codexwatch.__version__)')"
          export CODEX_HOME="$RUNNER_TEMP/codex" CODEXWATCH_DIR="$RUNNER_TEMP/data" CODEXHOP_DIR="$RUNNER_TEMP/hop"
          python -c 'from codexwatch.demo import generate; generate("'"$RUNNER_TEMP"'/codex", days=10)'
          codexwatch --json | python -c 'import json,sys; d=json.load(sys.stdin); assert d["periods"]["all"]["requests"] > 0'
          codexwatch card -o "$RUNNER_TEMP/card.svg"
          python -c 'import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])' "$RUNNER_TEMP/card.svg"
      - name: the wheel carries the dashboard, fonts and prices
        run: |
          set -euo pipefail
          files="$(python -m zipfile -l dist/*.whl)"
          for want in codexwatch/web/index.html codexwatch/web/app.js codexwatch/web/style.css \
                      codexwatch/web/fonts/Geist.woff2 codexwatch/web/fonts/Geist-OFL.txt codexwatch/data/prices.json; do
            case "$files" in
              *"$want"*) ;;
              *) echo "missing from the wheel: $want"; exit 1 ;;
            esac
          done
