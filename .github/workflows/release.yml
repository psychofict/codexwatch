name: Release

# Tag a version and this ships it:
#   git tag -a v1.0.0 -m 'v1.0.0' && git push origin v1.0.0
# The tag must match __version__ in codexwatch/__init__.py or the build job fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the wheel and the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      - name: the tag and __version__ must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import codexwatch; print(codexwatch.__version__)')"
          test "$tag" = "$ver" || { echo "tag $tag != __version__ $ver"; exit 1; }

      # build and setuptools come pinned by hash, so the build is not left to fetch its own.
      - run: pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build --no-isolation

      - name: the wheel installs and runs
        run: |
          set -euo pipefail
          pip install dist/*.whl
          codexwatch --version | grep -qx "codexwatch $(python -c 'import codexwatch; print(codexwatch.__version__)')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/codexwatch-cli
    permissions:
      contents: read
      id-token: write   # lets PyPI check this run is the workflow it trusts; no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI trusts this repository, this workflow file and the
      # `pypi` environment (set up at pypi.org as a pending publisher for `codexwatch-cli`),
      # so there is no API token to store or leak.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  mcp-registry:
    name: publish to the MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write   # the registry checks this run belongs to psychofict's repository; no token is stored
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: server.json carries the tag's version
        run: |
          set -euo pipefail
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import json, sys
          v = sys.argv[1]
          doc = json.load(open("server.json"))
          doc["version"] = v
          for p in doc["packages"]:
              p["version"] = v
          json.dump(doc, open("server.json", "w"), indent=2)
          EOF

      # The registry reads the package's PyPI page to confirm ownership, so it
      # must be able to see the version the job above just uploaded.
      - name: wait for the version on PyPI
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl --fail --silent --output /dev/null "https://pypi.org/pypi/codexwatch-cli/$v/json" && exit 0
            sleep 10
          done
          echo "codexwatch-cli $v is not on PyPI after 5 minutes"; exit 1

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
