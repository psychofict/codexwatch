name: Release

# Tag a version and this ships it:
#   git tag -a v1.0.0 -m 'v1.0.0' && git push origin v1.0.0
# The tag must match __version__ in codexwatch/__init__.py or the build job fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the wheel and the sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: the tag and __version__ must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import codexwatch; print(codexwatch.__version__)')"
          test "$tag" = "$ver" || { echo "tag $tag != __version__ $ver"; exit 1; }

      - run: pip install build
      - run: python -m build

      - name: the wheel installs and runs
        run: |
          set -euo pipefail
          pip install dist/*.whl
          codexwatch --version | grep -qx "codexwatch $(python -c 'import codexwatch; print(codexwatch.__version__)')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/codexwatch-cli
    permissions:
      contents: read
      id-token: write   # lets PyPI check this run is the workflow it trusts; no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Trusted publishing: PyPI trusts this repository, this workflow file and the
      # `pypi` environment (set up at pypi.org as a pending publisher for `codexwatch-cli`),
      # so there is no API token to store or leak.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
