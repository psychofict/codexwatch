[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexwatch"
dynamic = ["version"]
description = "See where your OpenAI Codex tokens, dollars and plan limits go: exact per-response accounting, live 5-hour and weekly limits from your own logs, quota forensics, a web dashboard, status bars, a tray, an MCP server and a share card. No dependencies, no login."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ebenworks", email = "contact@ebenworks.co" }]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "codex", "openai-codex", "codex-cli", "chatgpt", "usage", "token-usage", "cost-tracking",
    "rate-limits", "quota", "dashboard", "mcp", "statusline", "swiftbar", "waybar", "tray",
    "developer-tools", "cli", "ai", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/psychofict/codexwatch"
Repository = "https://github.com/psychofict/codexwatch"
Documentation = "https://github.com/psychofict/codexwatch#readme"
Changelog = "https://github.com/psychofict/codexwatch/blob/main/CHANGELOG.md"
"Security policy" = "https://github.com/psychofict/codexwatch/blob/main/SECURITY.md"
Issues = "https://github.com/psychofict/codexwatch/issues"
Author = "https://ebenworks.co/"

[project.scripts]
codexwatch = "codexwatch.cli:console_main"

[tool.setuptools]
packages = ["codexwatch"]

[tool.setuptools.package-data]
codexwatch = ["data/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "codexwatch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 145
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP007", "UP045"]
